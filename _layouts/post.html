---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      {{ page.date | date: "%B %d, %Y" }}
      {% if page.tags.size > 0 %}
        · {% for tag in page.tags %}<span class="tag">{{ tag }}</span> {% endfor %}
      {% endif %}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <hr>
    <p><a href="{{ site.baseurl }}/">← Back to home</a></p>
  </footer>
</article>
